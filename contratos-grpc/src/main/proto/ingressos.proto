syntax = "proto3";

package ingressos;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "br.com.ticket.wizard.grpc.ingressos";

// Erros de negócio voltam como status gRPC (INVALID_ARGUMENT, NOT_FOUND,
// FAILED_PRECONDITION), nunca como campo na resposta.
service IngressoService {
  rpc CadastrarCategoriaIngresso(CategoriaRequest) returns (Categoria);

  rpc ListarCategorias(ListarCategoriasRequest) returns (ListarCategoriasResponse);

  // NOT_FOUND se a categoria não existe; FAILED_PRECONDITION se o estoque não basta.
  rpc EmitirIngressos(EmitirIngressosRequest) returns (EmitirIngressosResponse);

  rpc ListarIngressos(ListarIngressosRequest) returns (ListarIngressosResponse);
}

message CategoriaRequest {
  string evento_id = 1;
  string nome_categoria = 2;
  // Valor em centavos: dinheiro nunca trafega como ponto flutuante.
  int64 preco_centavos = 3;
  int32 quantidade_disponivel = 4;
  string criado_por = 5;
}

message Categoria {
  string id = 1;
  string evento_id = 2;
  string nome = 3;
  int64 preco_centavos = 4;
  int32 quantidade_total = 5;
  int32 quantidade_disponivel = 6;
}

message ListarCategoriasRequest {
  // Vazio lista todas as categorias.
  string evento_id = 1;
}

message ListarCategoriasResponse {
  repeated Categoria categorias = 1;
}

message EmitirIngressosRequest {
  string categoria_id = 1;
  string usuario_id = 2;
  int32 quantidade = 3;
  string pedido_id = 4;
}

message EmitirIngressosResponse {
  repeated string ingresso_ids = 1;
  Categoria categoria = 2;
  int64 valor_total_centavos = 3;
}

message ListarIngressosRequest {
  string usuario_id = 1;
}

message Ingresso {
  string id = 1;
  string categoria_id = 2;
  string evento_id = 3;
  string nome_categoria = 4;
  string usuario_id = 5;
  string pedido_id = 6;
  google.protobuf.Timestamp emitido_em = 7;
}

message ListarIngressosResponse {
  repeated Ingresso ingressos = 1;
}
