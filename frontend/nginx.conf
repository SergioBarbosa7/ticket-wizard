server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Resolver via DNS do Docker + variável: o nginx sobe mesmo se o gateway ainda
        # não estiver de pé (com proxy_pass direto, ele recusaria iniciar).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway http://api-gateway:8080;
        # Com variável e sem URI, o caminho original (/api/...) é repassado intacto.
        proxy_pass $gateway;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;
    }
}
